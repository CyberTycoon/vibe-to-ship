<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect x="0" y="0" width="760" height="240" rx="16" fill="#f6f5f2"/>
  <rect x="0.5" y="0.5" width="759" height="239" rx="15.5" fill="none" stroke="#0d0d0c" stroke-opacity="0.12"/>

  <!-- BEFORE -->
  <text x="24" y="34" font-size="13" font-weight="bold" fill="#0d0d0c">Before — fake edge: B waits on A for nothing</text>
  <g font-size="12" text-anchor="middle">
    <rect x="24" y="52" width="90" height="36" rx="8" fill="#0d0d0c"/>
    <text x="69" y="75" fill="#f6f5f2" font-weight="bold">A: lint</text>
    <line x1="114" y1="70" x2="158" y2="70" stroke="#0d0d0c" stroke-opacity="0.4" stroke-width="2"/>
    <text x="136" y="62" font-size="14" fill="#b3261e">✕</text>
    <rect x="158" y="52" width="90" height="36" rx="8" fill="#0d0d0c"/>
    <text x="203" y="75" fill="#f6f5f2" font-weight="bold">B: test</text>
    <line x1="248" y1="70" x2="292" y2="70" stroke="#0d0d0c" stroke-opacity="0.4" stroke-width="2"/>
    <text x="270" y="62" font-size="14" fill="#b3261e">✕</text>
    <rect x="292" y="52" width="90" height="36" rx="8" fill="#0d0d0c"/>
    <text x="337" y="75" fill="#f6f5f2" font-weight="bold">C: docs</text>
  </g>
  <text x="24" y="112" font-size="11" fill="#0d0d0c" fill-opacity="0.6">sequential · B never reads A's output · total ~15 min</text>

  <line x1="24" y1="128" x2="736" y2="128" stroke="#0d0d0c" stroke-opacity="0.12"/>

  <!-- AFTER -->
  <text x="24" y="154" font-size="13" font-weight="bold" fill="#0d0d0c">After — edges cut, all three run at once</text>
  <g font-size="12" text-anchor="middle">
    <rect x="24" y="168" width="90" height="36" rx="8" fill="#5b3fd4">
      <animate attributeName="opacity" values="1;0.8;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <text x="69" y="191" fill="#f6f5f2" font-weight="bold">A: lint</text>
    <rect x="158" y="168" width="90" height="36" rx="8" fill="#5b3fd4">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <text x="203" y="191" fill="#f6f5f2" font-weight="bold">B: test</text>
    <rect x="292" y="168" width="90" height="36" rx="8" fill="#5b3fd4">
      <animate attributeName="opacity" values="1;0.8;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <text x="337" y="191" fill="#f6f5f2" font-weight="bold">C: docs</text>
    <line x1="392" y1="186" x2="440" y2="186" stroke="#5b3fd4" stroke-width="2.5"/>
    <rect x="440" y="168" width="150" height="36" rx="8" fill="#0d0d0c"/>
    <text x="515" y="191" fill="#f6f5f2" font-weight="bold">verify → ship</text>
  </g>
  <text x="24" y="226" font-size="11" fill="#0d0d0c" fill-opacity="0.6">parallel · same result · total ~15 s + one verify pass</text>
</svg>
