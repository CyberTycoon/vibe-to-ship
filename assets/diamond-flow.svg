<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect x="0" y="0" width="760" height="220" rx="16" fill="#f6f5f2"/>
  <rect x="0.5" y="0.5" width="759" height="219" rx="15.5" fill="none" stroke="#0d0d0c" stroke-opacity="0.12"/>
  <text x="24" y="34" font-size="13" font-weight="bold" fill="#0d0d0c">The Diamond — one node fans out, skeptics verify</text>

  <!-- edges -->
  <line x1="120" y1="120" x2="220" y2="120" stroke="#0d0d0c" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="330" y1="120" x2="420" y2="120" stroke="#0d0d0c" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="540" y1="120" x2="630" y2="120" stroke="#0d0d0c" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 5">
    <animate attributeName="stroke-dashoffset" from="0" to="22" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- node: fan out -->
  <g>
    <circle cx="70" cy="120" r="26" fill="#5b3fd4">
      <animate attributeName="r" values="26;29;26" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.85;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="70" y="125" font-size="13" font-weight="bold" fill="#f6f5f2" text-anchor="middle">1×4</text>
    <text x="70" y="165" font-size="11" fill="#0d0d0c" text-anchor="middle">Fan out</text>
    <text x="70" y="180" font-size="10" fill="#0d0d0c" fill-opacity="0.55" text-anchor="middle">4 workers</text>
  </g>

  <!-- node: reduce -->
  <g>
    <circle cx="175" cy="120" r="26" fill="#0d0d0c">
      <animate attributeName="r" values="26;29;26" dur="2s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.85;1" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="175" y="125" font-size="13" font-weight="bold" fill="#f6f5f2" text-anchor="middle">∑</text>
    <text x="175" y="165" font-size="11" fill="#0d0d0c" text-anchor="middle">Reduce</text>
    <text x="175" y="180" font-size="10" fill="#0d0d0c" fill-opacity="0.55" text-anchor="middle">0 tokens</text>
  </g>

  <!-- node: verify x2 -->
  <g>
    <circle cx="275" cy="95" r="22" fill="none" stroke="#5b3fd4" stroke-width="3">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="275" y="99" font-size="12" font-weight="bold" fill="#5b3fd4" text-anchor="middle">?</text>
    <circle cx="275" cy="150" r="22" fill="none" stroke="#5b3fd4" stroke-width="3">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="275" y="154" font-size="12" font-weight="bold" fill="#5b3fd4" text-anchor="middle">?</text>
    <text x="275" y="192" font-size="11" fill="#0d0d0c" text-anchor="middle">Verify ×2</text>
    <text x="275" y="206" font-size="10" fill="#0d0d0c" fill-opacity="0.55" text-anchor="middle">fresh context</text>
  </g>

  <!-- node: synthesize -->
  <g>
    <rect x="420" y="94" width="120" height="52" rx="10" fill="#0d0d0c">
      <animate attributeName="opacity" values="1;0.85;1" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <text x="480" y="116" font-size="11" font-weight="bold" fill="#f6f5f2" text-anchor="middle">SYNTHESIZE</text>
    <text x="480" y="132" font-size="10" fill="#f6f5f2" fill-opacity="0.7" text-anchor="middle">one report</text>
    <text x="480" y="165" font-size="11" fill="#0d0d0c" text-anchor="middle">Synthesize</text>
    <text x="480" y="180" font-size="10" fill="#0d0d0c" fill-opacity="0.55" text-anchor="middle">human approves</text>
  </g>

  <!-- node: learn -->
  <g>
    <circle cx="685" cy="120" r="26" fill="none" stroke="#0d0d0c" stroke-width="2.5" stroke-dasharray="5 4">
      <animateTransform attributeName="transform" type="rotate" from="0 685 120" to="360 685 120" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text x="685" y="125" font-size="14" font-weight="bold" fill="#0d0d0c" text-anchor="middle">✓</text>
    <text x="685" y="165" font-size="11" fill="#0d0d0c" text-anchor="middle">Learn</text>
    <text x="685" y="180" font-size="10" fill="#0d0d0c" fill-opacity="0.55" text-anchor="middle">record + debrief</text>
  </g>

  <text x="24" y="206" font-size="10" fill="#0d0d0c" fill-opacity="0.5">15 min sequential → ~15 s parallel · max 3 attempts · no auto-push</text>
</svg>
