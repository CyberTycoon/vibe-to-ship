<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect x="0" y="0" width="760" height="260" rx="16" fill="#f6f5f2"/>
  <rect x="0.5" y="0.5" width="759" height="259" rx="15.5" fill="none" stroke="#0d0d0c" stroke-opacity="0.12"/>
  <text x="24" y="36" font-size="13" font-weight="bold" fill="#0d0d0c">The Diamond — one node fans out, skeptics verify</text>

  <!-- edges -->
  <line x1="102" y1="125" x2="158" y2="125" stroke="#0d0d0c" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="212" y1="125" x2="288" y2="125" stroke="#0d0d0c" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="332" y1="125" x2="430" y2="125" stroke="#0d0d0c" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 5">
    <animate attributeName="stroke-dashoffset" from="0" to="22" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <line x1="560" y1="125" x2="673" y2="125" stroke="#0d0d0c" stroke-opacity="0.25" stroke-width="2"/>

  <!-- node: fan out -->
  <g>
    <circle cx="75" cy="125" r="27" fill="#5b3fd4">
      <animate attributeName="r" values="27;30;27" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.85;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="75" y="130" font-size="13" font-weight="bold" fill="#f6f5f2" text-anchor="middle">1×4</text>
    <text x="75" y="176" font-size="11" fill="#0d0d0c" text-anchor="middle">Fan out</text>
    <text x="75" y="191" font-size="10" fill="#0d0d0c" fill-opacity="0.55" text-anchor="middle">4 workers</text>
  </g>

  <!-- node: reduce -->
  <g>
    <circle cx="185" cy="125" r="27" fill="#0d0d0c">
      <animate attributeName="r" values="27;30;27" dur="2s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.85;1" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="185" y="130" font-size="13" font-weight="bold" fill="#f6f5f2" text-anchor="middle">∑</text>
    <text x="185" y="176" font-size="11" fill="#0d0d0c" text-anchor="middle">Reduce</text>
    <text x="185" y="191" font-size="10" fill="#0d0d0c" fill-opacity="0.55" text-anchor="middle">0 tokens</text>
  </g>

  <!-- node: verify x2 -->
  <g>
    <circle cx="310" cy="98" r="22" fill="none" stroke="#5b3fd4" stroke-width="3">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="310" y="102" font-size="12" font-weight="bold" fill="#5b3fd4" text-anchor="middle">?</text>
    <circle cx="310" cy="152" r="22" fill="none" stroke="#5b3fd4" stroke-width="3">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="310" y="156" font-size="12" font-weight="bold" fill="#5b3fd4" text-anchor="middle">?</text>
    <text x="310" y="196" font-size="11" fill="#0d0d0c" text-anchor="middle">Verify ×2</text>
    <text x="310" y="211" font-size="10" fill="#0d0d0c" fill-opacity="0.55" text-anchor="middle">fresh context</text>
  </g>

  <!-- node: synthesize -->
  <g>
    <rect x="430" y="98" width="130" height="54" rx="10" fill="#0d0d0c">
      <animate attributeName="opacity" values="1;0.85;1" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <text x="495" y="120" font-size="11" font-weight="bold" fill="#f6f5f2" text-anchor="middle">SYNTHESIZE</text>
    <text x="495" y="136" font-size="10" fill="#f6f5f2" fill-opacity="0.7" text-anchor="middle">one report</text>
    <text x="495" y="176" font-size="11" fill="#0d0d0c" text-anchor="middle">Synthesize</text>
    <text x="495" y="191" font-size="10" fill="#0d0d0c" fill-opacity="0.55" text-anchor="middle">human approves</text>
  </g>

  <!-- node: learn -->
  <g>
    <circle cx="700" cy="125" r="27" fill="none" stroke="#0d0d0c" stroke-width="2.5" stroke-dasharray="5 4">
      <animateTransform attributeName="transform" type="rotate" from="0 700 125" to="360 700 125" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text x="700" y="130" font-size="14" font-weight="bold" fill="#0d0d0c" text-anchor="middle">✓</text>
    <text x="700" y="176" font-size="11" fill="#0d0d0c" text-anchor="middle">Learn</text>
    <text x="700" y="191" font-size="10" fill="#0d0d0c" fill-opacity="0.55" text-anchor="middle">record + debrief</text>
  </g>

  <text x="24" y="244" font-size="10" fill="#0d0d0c" fill-opacity="0.5">15 min sequential → ~15 s parallel · max 3 attempts · no auto-push</text>
</svg>
